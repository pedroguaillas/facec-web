expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Código inmutable dentro de la imagen: no revalida timestamps en cada
; request. Un deploy nuevo = imagen nueva = contenedor reiniciado.
opcache.validate_timestamps = 0

; La API no usa progreso de subida por sesión. Apagado reduce superficie de
; CVE-2026-115560 (session upload progress → RCE), además del parche 8.5.13.
session.upload_progress.enabled = Off
