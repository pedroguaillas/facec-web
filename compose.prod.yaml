# IMPORTANTE: corre siempre con --env-file .env.production, ej:
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Sin --env-file, Compose usa el .env de la raíz (el de DEV) para resolver
# los ${DB_PASSWORD} etc. de este archivo, mientras 'app' usa .env.production
# vía env_file — quedarían con credenciales de DB distintas entre sí.
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.prod
        image: facec-web-app:latest
        restart: unless-stopped
        env_file:
            - .env.production
        volumes:
            - storage-app:/var/www/html/storage/app
        networks:
            - app
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            go-signer:
                condition: service_healthy

    queue:
        image: facec-web-app:latest
        restart: unless-stopped
        env_file:
            - .env.production
        volumes:
            - storage-app:/var/www/html/storage/app
        networks:
            - app
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            go-signer:
                condition: service_healthy
        command: php artisan queue:work --sleep=3
        # La imagen trae un HEALTHCHECK (Dockerfile.prod) que hace `curl http://localhost/up`,
        # pensado para el container `app` (nginx+php-fpm vía supervisord). Este container
        # solo corre `queue:work`, no sirve HTTP — el healthcheck heredado fallaría siempre.
        healthcheck:
            disable: true

    go-signer:
        build:
            context: ./go-signer
            dockerfile: Dockerfile
        restart: unless-stopped
        volumes:
            - storage-app:/var/www/html/storage/app
        networks:
            - app
        healthcheck:
            test:
                - CMD-SHELL
                - 'wget -qO- http://localhost:8080/health || exit 1'
            interval: 10s
            retries: 3

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 5
            interval: 10s
            timeout: 5s

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - redis-data:/data
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 5
            interval: 10s
            timeout: 5s

    caddy:
        image: 'caddy:2-alpine'
        restart: unless-stopped
        environment:
            APP_DOMAIN: '${APP_DOMAIN}'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        networks:
            - app
        depends_on:
            - app

    phpmyadmin:
        image: 'phpmyadmin:latest'
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
        ports:
            - '127.0.0.1:${PHPMYADMIN_PORT:-8081}:80'
        networks:
            - app
        depends_on:
            mysql:
                condition: service_healthy

networks:
    app:
        driver: bridge

volumes:
    storage-app:
        driver: local
    mysql-data:
        driver: local
    redis-data:
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
